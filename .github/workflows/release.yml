name: release

# A tag is the only thing that produces a release: `git tag v0.1.0 && git push
# origin v0.1.0`. A manual run must name the tag too (Run workflow → tag =
# v0.1.0), so it builds the tagged commit instead of whatever is on the default
# branch. Either way the workflow builds and tests that exact commit, then
# attaches the installer, blockmap and latest.yml to a **draft** GitHub Release.
# Review the draft and publish it to make the feed live.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v0.1.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      # A tag push knows its tag from the ref; a manual run has to be told.
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Resolve release tag
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TAG) {
            throw 'No release tag: push a v* tag or pass the `tag` input.'
          }
          "Building $env:RELEASE_TAG from refs/tags/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY

      # Check out the tag itself, not the default branch, so a manual run
      # publishes the commit the tag points at.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # electron and electron-builder download ~150 MB of tools on every cold
      # run (Electron, NSIS, winCodeSign). Keep them between runs.
      - name: Cache Electron tooling
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        run: node scripts/check-release-version.mjs $env:RELEASE_TAG

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      # The full e2e suite (including PTY and watcher timing) runs in ci.yml on
      # every push. Re-running it here duplicated a flaky, timing-sensitive job;
      # the release gate is the packaged smoke test below.
      - name: Build installer and latest.yml
        run: pnpm dist

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $expected = @(
            "Nest-Setup-$version.exe",
            "Nest-Setup-$version.exe.blockmap",
            "latest.yml"
          )
          foreach ($name in $expected) {
            $file = Join-Path "apps/desktop/release" $name
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing release artifact: $name (run pnpm dist first)"
            }
            $size = (Get-Item -LiteralPath $file).Length
            Write-Host "$name ($size bytes)"
          }

      # Same smoke as `pnpm test:e2e`, but forced against the packaged app.
      # It proves asar, unpacked node-pty, fake-harness resource and SQLite
      # inside the artifact that is about to be published.
      - name: Packaged smoke test
        env:
          NEST_E2E_EXE: ${{ github.workspace }}\apps\desktop\release\win-unpacked\Nest.exe
          NEST_DISABLE_UPDATES: '1'
          NEST_DISABLE_SINGLE_INSTANCE: '1'
          NEST_DISABLE_TRAY: '1'
          NEST_DISABLE_NOTIFICATIONS: '1'
        run: pnpm --filter @nest/desktop exec playwright test e2e/packaged.spec.ts

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nest-windows-${{ env.RELEASE_TAG }}-${{ github.run_number }}
          path: |
            apps/desktop/release/Nest-Setup-*.exe
            apps/desktop/release/Nest-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 30

      # Draft by default: publishing is the moment every installed Nest starts
      # seeing the new version through `releases/latest/download`. Reruns update
      # the same draft instead of creating duplicates.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nest ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/Nest-Setup-*.exe
            apps/desktop/release/Nest-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml

      - name: Summary
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          "## Nest $version" >> $env:GITHUB_STEP_SUMMARY
          "Installer: ``Nest-Setup-$version.exe``" >> $env:GITHUB_STEP_SUMMARY
          "Tag: ``$env:RELEASE_TAG``" >> $env:GITHUB_STEP_SUMMARY
          "Release created as a **draft**. Publish it to make ``latest.yml`` live." >> $env:GITHUB_STEP_SUMMARY
          "Feed: https://github.com/${{ github.repository }}/releases/latest/download/" >> $env:GITHUB_STEP_SUMMARY
