packages:
  - apps/*
  - packages/*

minimumReleaseAgeExclude:
  - electron@45.5.0

onlyBuiltDependencies:
  - electron
  - node-pty
  - esbuild
  - '@tailwindcss/oxide'
  - '@parcel/watcher'

allowBuilds:
  electron: true
  node-pty: true
  esbuild: true
  '@tailwindcss/oxide': true
  electron-winstaller: true
  # The install script only runs node-gyp when npm_config_build_from_source is
  # set; the win32-x64 prebuild ships in @parcel/watcher-win32-x64.
  '@parcel/watcher': true
